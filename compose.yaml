# Sample Docker Compose setup for Hegram.
#
#   docker compose up -d            # pull the published image and start it
#   docker compose up -d --build    # build the image from this repository instead
#
# The app is then served on http://localhost:5844.
services:
  hegram:
    # Published by the GitHub workflow on every push to main; pin a `sha-<commit>` tag to stay on a version.
    image: ghcr.io/nplinden/hegram:latest
    # Used by `--build`, or when the image can't be pulled.
    build: .
    ports:
      - "5844:5844"
    restart: unless-stopped
    # Healthy when the home page answers; -f makes curl fail on an HTTP error status.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5844/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
