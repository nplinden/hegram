[project]
name = "hegram"
version = "0.1.0"
description = "A web app for learning Biblical Hebrew: verb statistics from the Hebrew Bible, conjugation exercises and grammar tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "dash-iconify>=0.1.2",
    "dash-mantine-components>=0.15.3",
    "dash>=2.18.2",
    "gunicorn>=23.0.0",
    "hebrew>=0.8.1",
    "loguru>=0.7.3",
    "plotly>=5.24.1",
    "polars>=1.26.0",
    "weasyprint>=70.0",
]

[dependency-groups]
# Notebooks for exploring the data, installed by default by `uv sync` and `uv run`.
dev = ["jupyter>=1.1.1"]
# Builds the corpus data, see README: `uv run --group build python -m hegram.build_dataframes`.
build = ["requests>=2.32.3", "text-fabric>=12.6.2"]

[tool.ruff]
line-length = 120
