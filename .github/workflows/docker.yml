name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to the GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Tags: `latest` for the newest main build, and `sha-<commit>` for every build, to deploy or roll back
      # to an exact version. The labels link the package to this repository on GitHub.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Builds the image, including the corpus data (see README). Layers are cached between runs,
      # so the system packages, dependencies and data are only rebuilt when their inputs change.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hegram:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A successful build doesn't mean the app starts: check that gunicorn boots and serves the pages.
      - name: Smoke test
        run: |
          docker run -d --name hegram -p 5844:5844 hegram:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5844/ && break
            sleep 2
          done
          for page in / /statistics /exercises/conjugation /paal_strong; do
            curl -sf -o /dev/null "http://localhost:5844$page" || { echo "GET $page failed"; docker logs hegram; exit 1; }
            echo "GET $page OK"
          done

      # Publish only images from main that passed the smoke test; pull requests just build and test.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as above: every layer comes from the cache, so this only pushes.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
